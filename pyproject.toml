[project]
name = "nwupdater"
dynamic = ["version"]
description = "Unofficial, hobby headless updater for NumWorks calculators (Graphique N01xx / Scientifique N02xx) without Chrome/WebUSB — no warranty, use at your own risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["numworks", "calculator", "dfu", "firmware", "updater", "epsilon"]
authors = [{ name = "nwupdater contributors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]
# Core has NO runtime dependency: dev/tests run against the in-process virtual DFU device
# (nwupdater.testing.virtual_dfu) and the stdlib-only local server.
dependencies = []

[project.optional-dependencies]
# NB: installing a *distributed* (relocatable-ELF) .nwa third-party app also needs `nwlink`, a
# Node/npm package (used at runtime via `npx`, or NWUPDATER_NWLINK) — NOT a Python dep, so it
# can't live here. See nwupdater.apps.link. Pre-linked .nwa blobs need nothing extra.
usb = ["pyusb>=1.3", "libusb-package>=1.0"]  # talk to REAL hardware (bundled libusb backend)
auth = ["certifi>=2024.0"]            # CA bundle for TLS on Python builds without system CAs
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "bandit>=1.8", "mypy>=1.8"]
test-ui = ["playwright>=1.40"]     # headless-browser smoke test of the local web UI

[project.urls]
Repository = "https://github.com/1e1/epsilon-updater"

[project.scripts]
nwupdater = "nwupdater.cli:main"
nwupdater-capture = "nwupdater.tools.capture_cli:main"

[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The git tag is the single source of truth for the version — no manual bump. setuptools-scm
# derives it and bakes it into src/nwupdater/_version.py at build/install time (git-ignored).
# On a tag vX.Y.Z you get X.Y.Z; N commits past it you get the next version's .devN+g<hash>.
# A bare source tree that was never built has no tag context, hence the sentinel below — but
# diagnose._version() prefers a live `git describe` in that case, so dev runs still self-identify.
version_file = "src/nwupdater/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nwupdater" = ["py.typed"]
"nwupdater.catalog" = ["data/*.json"]
"nwupdater.apps" = ["data/*.json"]
"nwupdater.server" = ["web/*"]
"nwupdater.tools" = ["web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage is opt-in (CI passes --cov) so a plain `pytest -q` stays fast; the threshold below
# still gates any run that measures coverage.

[tool.coverage.run]
branch = true
source = ["nwupdater"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol method stubs
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# Pragmatic, not strict: the goal is to catch real type errors without drowning a hobby
# project in churn. Third-party stubs (pyusb/libusb/certifi) are absent by design.
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# On top of ruff's default rule set, add import sorting (I) and pycodestyle warnings (W).
extend-select = ["I", "W"]
# Broad exception handling is deliberate at our I/O and best-effort boundaries: USB device
# transfers, HTTP request handlers, hardware disconnects and cleanup all catch broadly and
# continue rather than crash the tool. Narrowing these would change behaviour, so we accept
# the blind-except / try-except-pass patterns instead of annotating dozens of call sites.
ignore = ["BLE001", "S110", "S112"]
