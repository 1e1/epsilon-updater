[project]
name = "nwupdater"
dynamic = ["version"]
description = "Unofficial, hobby headless updater for NumWorks calculators (Graphique N01xx / Scientifique N02xx) without Chrome/WebUSB — no warranty, use at your own risk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["numworks", "calculator", "dfu", "firmware", "updater", "epsilon"]
authors = [{ name = "nwupdater contributors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]
# Core has NO runtime dependency: dev/tests run against the in-process virtual DFU device
# (nwupdater.testing.virtual_dfu) and the stdlib-only local server.
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.3", "libusb-package>=1.0"]  # talk to REAL hardware (bundled libusb backend)
auth = ["certifi>=2024.0"]            # CA bundle for TLS on Python builds without system CAs
dev = ["pytest>=8", "ruff>=0.11", "bandit>=1.8", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/1e1/epsilon-updater"

[project.scripts]
nwupdater = "nwupdater.cli:main"
nwupdater-capture = "nwupdater.tools.capture_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "nwupdater.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nwupdater" = ["py.typed"]
"nwupdater.catalog" = ["data/*.json"]
"nwupdater.apps" = ["data/*.json"]
"nwupdater.server" = ["web/*"]
"nwupdater.tools" = ["web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# Pragmatic, not strict: the goal is to catch real type errors without drowning a hobby
# project in churn. Third-party stubs (pyusb/libusb/certifi) are absent by design.
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Deferred: these modules carry latent Optional/None-attribute issues that are cleanest to
# resolve alongside the planned server-layer refactor (session/httpd God-object split) and a
# typing pass over the capture tools. Type-checked but not gating yet.
[[tool.mypy.overrides]]
module = [
    "nwupdater.server.session",
    "nwupdater.server.httpd",
    "nwupdater.tools.*",
    "nwupdater.testing.virtual_dfu",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# default rules (pyflakes F + pycodestyle E4/E7/E9) plus import sorting (I) and pep8-naming.
extend-select = ["I", "W"]
