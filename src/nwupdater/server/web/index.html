<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nwupdater</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="apple-mobile-web-app-title" content="nwupdater">
<style>
  :root {
    color-scheme: light dark;
    --desk:#e4e2db; --desk2:#eeece6;
    --bg:#edece7; --panel:#f6f4ef; --card:#ffffff; --ink:#1b1c1e; --muted:#6d6f74;
    --line:#e6e3dc; --line-strong:#d8d4ca; --chrome:#f1efe9;
    --accent:#e8930c; --accent-soft:#fbe9cd; --accent-ink:#7a4d05;
    --ok:#1f9d57; --ok-soft:#dcf1e5; --err:#d64545;
    --blue:#3d68c9; --blue-soft:#e2ecfd; --blue-ink:#2d5bbf;
    --radius:12px; --shadow:0 1px 2px rgba(30,25,15,.05), 0 18px 50px rgba(30,25,15,.14);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --desk:#0d0e11; --desk2:#16171b; --bg:#141519; --panel:#191b20; --card:#1f2228;
      --ink:#eceef1; --muted:#969aa2; --line:#2a2d34; --line-strong:#363a42; --chrome:#1c1e24;
      --accent:#f7b53d; --accent-soft:#3a2e14; --accent-ink:#f7c469; --ok:#3fbd77; --ok-soft:#16301f;
      --err:#e26a6a; --blue:#6f9bff; --blue-soft:#1b2740; --blue-ink:#93b6ff;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 60px rgba(0,0,0,.55); }
  }
  :root[data-theme="light"]{ --desk:#e4e2db; --desk2:#eeece6; --bg:#edece7; --panel:#f6f4ef; --card:#fff;
    --ink:#1b1c1e; --muted:#6d6f74; --line:#e6e3dc; --line-strong:#d8d4ca; --chrome:#f1efe9;
    --accent:#e8930c; --accent-soft:#fbe9cd; --accent-ink:#7a4d05; --ok:#1f9d57; --ok-soft:#dcf1e5;
    --err:#d64545; --blue:#3d68c9; --blue-soft:#e2ecfd; --blue-ink:#2d5bbf;
    --shadow:0 1px 2px rgba(30,25,15,.05), 0 18px 50px rgba(30,25,15,.14); }
  :root[data-theme="dark"]{ --desk:#0d0e11; --desk2:#16171b; --bg:#141519; --panel:#191b20; --card:#1f2228;
    --ink:#eceef1; --muted:#969aa2; --line:#2a2d34; --line-strong:#363a42; --chrome:#1c1e24;
    --accent:#f7b53d; --accent-soft:#3a2e14; --accent-ink:#f7c469; --ok:#3fbd77; --ok-soft:#16301f;
    --err:#e26a6a; --blue:#6f9bff; --blue-soft:#1b2740; --blue-ink:#93b6ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 60px rgba(0,0,0,.55); }

  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
    background:radial-gradient(1200px 600px at 50% -10%, var(--desk2), transparent 60%), var(--desk);
    height:100vh; overflow:hidden; padding:18px 16px; }
  @media (max-width:620px){ body{ height:auto; min-height:100vh; overflow:auto; } }
  button, input, select { font-family:inherit; }
  .btn:focus-visible, button:focus-visible, [contenteditable]:focus-visible,
  input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }

  /* -- window shell -------------------------------------------------------------- */
  .window { max-width:1140px; margin:0 auto; height:100%;
    background:var(--card); border:1px solid var(--line-strong); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
  @media (max-width:620px){ .window{ height:auto; } }
  .toolbar { height:54px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; }
  .brand .logo { width:26px; height:26px; border-radius:7px; display:block; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .brand b { font-size:14px; font-weight:680; letter-spacing:-.01em; }
  .toolbar .sp { flex:1; }
  .seg { display:inline-flex; background:var(--card); border:1px solid var(--line-strong); border-radius:10px; padding:3px; gap:2px; }
  .seg button { position:relative; border:0; background:transparent; color:var(--muted); font:inherit; font-size:12.5px;
    font-weight:600; padding:6px 13px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .seg button[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent-ink); }
  /* account-connected state lives on the Individual toggle (no separate chip → no layout shift) */
  .seg button.conn[aria-pressed="true"]{ background:var(--ok-soft); color:var(--ok); }
  .cdot { position:absolute; top:2px; right:3px; width:7px; height:7px; border-radius:50%; background:var(--ok);
    box-shadow:0 0 0 2px var(--card); display:none; }
  .seg button.conn .cdot { display:block; }
  .seg button.conn[aria-pressed="true"] .cdot { display:none; }
  .seg svg { width:14px; height:14px; }
  .langseg button { padding:6px 9px; font-size:11.5px; font-weight:700; }
  .iconbtn { width:34px; height:34px; border-radius:9px; border:1px solid var(--line-strong); background:var(--card);
    color:var(--muted); cursor:pointer; display:grid; place-items:center; }
  .iconbtn:hover { color:var(--ink); } .iconbtn svg { width:16px; height:16px; }

  .body { flex:1; min-height:0; display:flex; }
  @media (max-width:620px){ .body{ flex-direction:column; } }

  /* -- device rail --------------------------------------------------------------- */
  .rail { width:250px; flex:none; border-right:1px solid var(--line); background:var(--panel);
    padding:16px 15px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  @media (max-width:620px){ .rail{ width:auto; border-right:0; border-bottom:1px solid var(--line); } }
  .calcname { display:flex; align-items:center; justify-content:center; gap:6px; }
  .cn-input { font:inherit; font-size:14.5px; font-weight:680; letter-spacing:-.01em; text-align:center; color:var(--ink);
    background:transparent; border:0; border-bottom:1.5px dashed transparent; border-radius:0; padding:2px 4px; width:auto; max-width:170px; }
  .cn-input:hover { border-bottom-color:var(--line-strong); }
  .cn-input:focus { outline:0; border-bottom-color:var(--accent); }
  .cn-input::placeholder { color:var(--muted); font-weight:600; }
  .cn-pencil { color:var(--muted); opacity:0; transition:opacity .12s; } .calcname:hover .cn-pencil { opacity:.65; }
  .cn-pencil svg { width:12px; height:12px; display:block; }
  .calc { display:flex; justify-content:center; padding:0 0 2px; }
  .calc svg { width:112px; height:auto; filter:drop-shadow(0 8px 16px rgba(0,0,0,.18)); }
  .spec { display:grid; grid-template-columns:auto 1fr; gap:8px 10px; font-size:12px; align-items:center; margin:2px 0 0; }
  .spec dt { color:var(--muted); }
  .spec dd { margin:0; text-align:right; font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums;
    display:flex; justify-content:flex-end; align-items:center; gap:6px; }
  .fam { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:10.5px;
    font-weight:700; font-family:var(--sans); }
  .fam.g { background:var(--accent-soft); color:var(--accent-ink); } .fam.s { background:#3b3e44; color:#f0f1f3; }
  .regok { color:var(--ok); display:inline-flex; } .regno { color:var(--muted); display:inline-flex; }
  .regok svg, .regno svg { width:15px; height:15px; }
  /* the whole serial value is the click target (bigger than an eye icon) */
  .serial { display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; font:inherit;
    color:inherit; padding:0 1px; cursor:pointer; border-bottom:1px dashed transparent; font-family:var(--mono); font-size:11.5px; }
  .serial:hover { border-bottom-color:var(--line-strong); } .serial .val { transition:filter .12s; }
  .serial.blur .val { filter:blur(4.5px); user-select:none; }
  .demo-switch { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); margin-top:2px; }
  .demo-switch select { min-width:0; flex:1; padding:5px 8px; font-size:12px; }
  .rail-foot { margin-top:auto; padding-top:8px; }
  .rail-nodev { text-align:center; color:var(--muted); padding:24px 8px; }
  .rail-nodev .ico { font-size:30px; opacity:.7; } .rail-nodev p { font-size:12.5px; margin:8px 0 0; }

  /* -- main / tabs / panes ------------------------------------------------------- */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
  .tabbar { display:flex; gap:2px; padding:8px 12px 0; border-bottom:1px solid var(--line); background:var(--card); flex:none; }
  .tab { position:relative; border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600;
    padding:9px 14px 11px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab svg { width:16px; height:16px; }
  .tab .cnt { font-size:11px; color:var(--muted); background:var(--panel); border-radius:999px; padding:1px 7px; font-variant-numeric:tabular-nums; }
  .tab .cnt:empty { display:none; }
  .tab[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent); }
  .tab[aria-selected="true"] .cnt { background:var(--accent-soft); color:var(--accent-ink); }
  /* "update available" now signalled by a dot on the System tab title */
  .updot { width:7px; height:7px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

  .panes { flex:1; min-height:0; position:relative; }
  .pane { position:absolute; inset:0; overflow-y:auto; padding:16px 18px; display:none; }
  .pane.on { display:block; }
  .pane.workshop.on { display:flex; flex-direction:column; overflow:hidden; padding:14px 16px; }
  @media (max-width:620px){ .panes{ position:static; } .pane{ position:static; } }

  .nodev-main { display:none; position:absolute; inset:0; align-items:center; justify-content:center; padding:24px; }
  /* Disconnected: the workspace stays visible — the Parc (P3) and the System pane's cache/account
     (P3/P2) are device-independent. The device rail hosts the "connect a calculator" entry; the
     firmware flash card (device-dependent) hides until a calculator is present. */
  .rail-nodev .btn { width:100%; margin-top:12px; }
  .rail-nodev .demo-pick { flex-direction:column; gap:8px; margin-top:10px; }
  .rail-nodev .demo-pick select, .rail-nodev .demo-pick .btn { width:100%; margin-top:0; }
  .rail-nodev .hint { margin-top:12px; }
  .nodev { text-align:center; max-width:340px; }
  .nodev .ico { font-size:34px; opacity:.7; }
  .nodev h3 { font-size:15px; margin:10px 0 4px; }
  .nodev p { font-size:12.5px; color:var(--muted); margin:0 0 14px; }
  .nodev .row { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .demo-pick { display:flex; gap:8px; align-items:center; } .demo-pick select { min-width:0; }
  .waitdot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent);
    margin-right:6px; animation:pulse 1.3s ease-in-out infinite; }

  /* -- cards --------------------------------------------------------------------- */
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:12.5px; }
  .card2 { border:1px solid var(--line); border-radius:11px; background:var(--card); padding:14px; position:relative; }
  .card2 + .card2 { margin-top:12px; }
  .card2 h3 { font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px;
    font-weight:700; display:flex; align-items:center; gap:7px; }
  .card2 h3 svg { width:14px; height:14px; }
  select { font:inherit; font-size:13px; padding:8px 10px; border-radius:9px; color:var(--ink); background:var(--card);
    border:1px solid var(--line-strong); font-variant-numeric:tabular-nums; }
  .btn { font:inherit; font-size:13px; font-weight:650; padding:8px 15px; border-radius:9px; border:0; background:var(--accent);
    color:#1b1c1e; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn svg { width:14px; height:14px; } .btn.ghost { background:var(--panel); color:var(--ink); border:1px solid var(--line-strong); }
  .btn.sm { padding:6px 11px; font-size:12px; } .btn:disabled { opacity:.5; cursor:default; }
  .riskline { font-size:11.5px; color:var(--accent-ink); margin:11px 0 0; display:flex; gap:7px; align-items:flex-start; }
  .riskline svg { width:13px; height:13px; flex:none; margin-top:1px; }
  .hint { color:var(--muted); font-size:11.5px; margin:9px 0 0; }
  .dl-toggle { display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--muted); cursor:pointer; margin-top:11px; }
  .dl-toggle input { width:15px; height:15px; accent-color:var(--accent); margin-top:1px; flex:none; }
  .meterwrap { margin-top:12px; height:7px; border-radius:999px; background:var(--line); overflow:hidden; display:none; }
  .meterwrap.on { display:block; }
  .meter { height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .12s linear; }
  .meter.done { background:var(--ok); }
  .result { display:none; margin-top:12px; padding:11px 12px; border-radius:10px; font-size:13px;
    background:var(--ok-soft); border:1px solid color-mix(in srgb,var(--ok) 30%,transparent); }
  .result.on { display:block; } .result .r-ok { color:var(--ok); font-weight:650; }
  .result .r-reboot { display:block; margin-top:4px; color:var(--ink); } .result .r-reboot b { color:var(--accent-ink); }

  .auth-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:2px; }
  .auth-row input { font:inherit; font-size:12.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--card); color:var(--ink); flex:1; min-width:140px; }
  .acct-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .acct-purpose { margin:11px 0 0; }
  .authok { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ok);
    background:var(--ok-soft); border-radius:999px; padding:4px 10px; }
  .authok svg { width:13px; height:13px; }
  .auth-adv { margin-top:12px; } .auth-adv summary { cursor:pointer; font-size:12px; color:var(--muted); }
  .auth-adv[open] summary { margin-bottom:8px; }
  .offline { display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; color:var(--blue-ink);
    background:var(--blue-soft); border-radius:999px; padding:4px 10px; }
  .offline svg { width:13px; height:13px; }
  .cls-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .cacherow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 11px;
    border:1px solid var(--line); border-radius:9px; background:var(--panel); font-size:12.5px; margin-bottom:6px; }
  .cacherow .sz { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .cache-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; }

  /* -- shared workshop (apps + scripts render identically) ----------------------- */
  .wk { flex:1; min-height:0; display:flex; flex-direction:column; }
  .wkhead { display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none; font-size:12px; color:var(--muted); }
  .wkhead b { color:var(--ink); font-family:var(--mono); } .wkhead-r { display:flex; align-items:center; gap:10px; }
  .srcbtn { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; color:var(--blue-ink);
    background:var(--blue-soft); border:0; border-radius:7px; padding:4px 9px; cursor:pointer; }
  .srcbtn svg { width:12px; height:12px; }
  .membar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--line-strong); gap:2px; margin:8px 0 6px; flex:none; }
  .membar > span { height:100%; }
  .seg-un { background:var(--ok); } .seg-rw { background:var(--accent); } .seg-new { background:var(--blue); } .seg-free { background:var(--line-strong); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); margin-bottom:10px; flex:none; }
  .legend i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:middle; }
  .cols2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; flex:1; min-height:0; }
  @media (max-width:560px){ .cols2 { grid-template-columns:1fr; } }
  .wcol { display:flex; flex-direction:column; min-height:0; min-width:0; }
  .colhead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; flex:none; }
  .colhead .sub-h { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; margin:0; }
  .colhead .cnt { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .sub-sub { font-size:10.5px; color:var(--muted); margin:0 0 8px; flex:none; }
  .wlist { flex:1; min-height:0; overflow-y:auto; padding-right:3px; }
  .item { display:flex; align-items:center; gap:9px; padding:8px 9px; border:1px solid var(--line); border-radius:9px;
    margin-bottom:6px; background:var(--card); }
  .item.oncalc { background:var(--panel); border-left:3px solid var(--ok); }
  .item.oncalc.st-rw { border-left-color:var(--accent); } .item.oncalc.st-new { border-left-color:var(--blue); }
  .item.oncalc.st-del { border-left-color:var(--line-strong); opacity:.6; } .item.oncalc.st-del .nm { text-decoration:line-through; }
  .item.grab { cursor:grab; } .item.grab:active { cursor:grabbing; } .item.drag-over { outline:2px dashed var(--accent); outline-offset:-2px; }
  .ic { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff; flex:none; }
  .ic.py { background:#2f3a4a; color:#8ec7ff; font-family:var(--mono); font-size:11px; }
  img.ic { object-fit:cover; background:transparent; }
  .grow { flex:1; min-width:0; }
  .nm { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .mt { font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:6px; } .mt.bad { color:var(--err); font-weight:600; }
  .mt svg { width:11px; height:11px; opacity:.7; flex:none; }   /* fixes oversized cloud/local/globe origin glyphs */
  .origin { display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex:none; }
  .origin svg { display:block; width:12px; height:12px; }
  .rowbtns { display:flex; gap:4px; flex:none; }
  .ib { border:1px solid var(--line-strong); background:var(--panel); color:var(--ink); cursor:pointer; width:26px; height:26px;
    border-radius:7px; display:grid; place-items:center; flex:none; font-size:12px; line-height:1; }
  .ib svg { width:13px; height:13px; display:block; }
  .ib.add { background:var(--accent); border-color:var(--accent); color:#1b1c1e; font-weight:700; }
  .ib.dl { color:var(--accent-ink); } .ib.dl:hover { background:var(--accent-soft); border-color:var(--accent); }
  .ib.dl.have { background:var(--ok-soft); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); }
  .ib:disabled { opacity:.4; cursor:default; }
  .tag { font-size:9px; font-weight:700; letter-spacing:.04em; padding:2px 6px; border-radius:999px; text-transform:uppercase; }
  .tag.un { background:var(--ok-soft); color:var(--ok); } .tag.rw { background:var(--accent-soft); color:var(--accent-ink); }
  .tag.new { background:var(--blue-soft); color:var(--blue-ink); } .tag.del { background:var(--line); color:var(--muted); }
  .tag.imp { background:var(--panel); color:var(--muted); border:1px solid var(--line-strong); }
  .empty { color:var(--muted); font-size:12.5px; padding:10px 2px; }
  /* Busy highlight — ONLY the concerned cards carry .busy: on a write, the items actually being
     written (rw/new); on a remote download, the single available item in flight. The action
     buttons still lock workshop-wide (.wk-busy .ib). Determinate fill from a real Content-Length. */
  .wk-busy .item.busy { background-image:linear-gradient(90deg, transparent 0%, color-mix(in srgb,var(--accent) 22%,transparent) 50%, transparent 100%);
    background-size:35% 100%; background-repeat:no-repeat; animation:dlsweep 1.15s linear infinite; }
  @keyframes dlsweep { from { background-position:-35% 0; } to { background-position:135% 0; } }
  .wk-busy .ib { pointer-events:none; opacity:.5; }
  .wk-busy.determinate .item.busy { animation:none; background-repeat:no-repeat; background-size:100% 100%;
    background-image:linear-gradient(90deg, color-mix(in srgb,var(--accent) 22%,transparent) 0%,
      color-mix(in srgb,var(--accent) 22%,transparent) var(--dlp,0%), transparent var(--dlp,0%)); }
  /* export progress fills RIGHT→LEFT (device→PC), the mirror of the write bar's left→right */
  .item.exporting { background:linear-gradient(to left, var(--accent-soft) 0 var(--exp,0%), transparent var(--exp,0%)), var(--panel); }
  /* taller drop zone, pinned to the bottom of the "On the calculator" column */
  .drop { flex:none; margin-top:10px; border:1.5px dashed var(--line-strong); border-radius:11px; min-height:88px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center;
    font-size:12px; color:var(--muted); background:var(--panel); cursor:copy; padding:10px; }
  .drop:hover, .drop.drag-over { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
  .drop svg { width:22px; height:22px; opacity:.7; } .drop label { color:var(--accent-ink); font-weight:650; cursor:pointer; text-decoration:underline; }
  .wplan { display:flex; align-items:center; gap:16px; margin-top:12px; padding-top:11px; border-top:1px solid var(--line); flex-wrap:wrap; flex:none; }
  .wplan .stat { font-size:10.5px; color:var(--muted); } .wplan .stat b { display:block; font-size:14px; color:var(--ink); font-family:var(--mono); }
  .wplan .spacer { flex:1; }

  /* -- roster ("Parc") — classes rail + calculator table ------------------------- */
  .pane.roster.on { display:flex; overflow:hidden; padding:0; }
  @media (max-width:620px){ .pane.roster.on { flex-direction:column; } }
  .parc-rail { width:210px; flex:none; border-right:1px solid var(--line); background:var(--panel);
    padding:14px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
  @media (max-width:620px){ .parc-rail { width:auto; border-right:0; border-bottom:1px solid var(--line); } }
  .parc-rail h4 { font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    margin:0 0 7px; font-weight:700; }
  .clsbtn { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    border:0; background:transparent; color:var(--ink); font:inherit; font-size:12.5px; font-weight:600;
    padding:7px 9px; border-radius:8px; cursor:pointer; text-align:left; }
  .clsbtn:hover { background:var(--card); }
  .clsbtn[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent-ink); }
  .clsbtn .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .clsbtn .cnt { font-size:11px; color:var(--muted); background:var(--card); border-radius:999px;
    padding:1px 7px; font-variant-numeric:tabular-nums; flex:none; }
  .clsbtn[aria-pressed="true"] .cnt { color:var(--accent-ink); }
  .parc-main { flex:1; min-width:0; overflow-y:auto; padding:14px 16px; }
  .parc-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  .parc-tbl th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); font-weight:700; padding:0 10px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .parc-tbl td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .parc-tbl tbody tr:last-child td { border-bottom:0; }
  .parc-tbl tbody tr:hover td { background:var(--panel); }
  .parc-tbl .pc-type { width:1%; }
  .parc-nm { font-weight:600; }
  .pc-ic { width:30px; height:30px; display:inline-grid; place-items:center; }
  .pc-ic svg { width:28px; height:28px; display:block; }
  .fwcell { display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  .fwchip { display:inline-flex; align-items:center; font-size:9px; font-weight:700; padding:2px 7px;
    border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
  .fwchip.ok { background:var(--ok-soft); color:var(--ok); }
  .fwchip.upd { background:var(--accent-soft); color:var(--accent-ink); }
  .parc-lastscan { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .parc-empty { color:var(--muted); font-size:13px; padding:30px 8px; text-align:center; }
  /* roster edit affordances — rename / move / delete / classes CRUD / multi-select */
  .parc-tbl .pc-sel { width:1%; }
  .parc-tbl .pc-act { width:1%; white-space:nowrap; text-align:right; }
  .parc-tbl .pc-act .mv { margin-right:6px; }
  .parc-tbl input[type=checkbox] { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; display:block; }
  .parc-tbl tr.sel td { background:var(--accent-soft); }
  .pnm { width:100%; min-width:90px; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:6px; padding:4px 6px; }
  .pnm:hover { border-color:var(--line); }
  .pnm:focus { outline:none; border-color:var(--accent); background:var(--card); }
  .pnm::placeholder { color:var(--muted); font-weight:500; }
  select.mv { font:inherit; font-size:12px; padding:5px 7px; border-radius:7px; border:1px solid var(--line-strong);
    background:var(--card); color:var(--ink); cursor:pointer; max-width:150px; }
  .ib.xs { width:20px; height:20px; border-radius:6px; }
  .ib.xs svg { width:11px; height:11px; }
  .btn.danger { background:var(--err); border-color:var(--err); color:#fff; }
  .clsbtn .cls-tools { display:none; gap:2px; flex:none; }
  .clsbtn:hover .cls-tools, .clsbtn:focus-within .cls-tools { display:inline-flex; }
  .clsbtn .cls-tools .ib { background:transparent; border-color:transparent; }
  .clsbtn .cls-tools .ib:hover { background:var(--card); border-color:var(--line); }
  .clsbtn.drop-hot { background:var(--accent-soft); outline:2px dashed var(--accent); outline-offset:-2px; }
  .cls-add { display:flex; gap:5px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .cls-add input { flex:1; min-width:0; font:inherit; font-size:12px; padding:6px 8px; border-radius:7px;
    border:1px solid var(--line-strong); background:var(--card); color:var(--ink); }
  .clsedit input { width:100%; font:inherit; font-size:12.5px; font-weight:600; padding:6px 8px;
    border-radius:7px; border:1px solid var(--accent); background:var(--card); color:var(--ink); }
  .cls-confirm { margin-top:10px; padding:10px; border-radius:9px; background:var(--card);
    border:1px solid var(--line-strong); font-size:12px; }
  .cls-confirm p { margin:0 0 8px; color:var(--ink); line-height:1.4; }
  .cls-confirm .row { display:flex; gap:6px; justify-content:flex-end; }
  .parc-bulk { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:8px 12px;
    background:var(--accent-soft); color:var(--accent-ink); border-radius:9px; }
  .parc-bulk .n { font-weight:700; font-size:12.5px; }
  .parc-bulk .mv { margin-left:auto; }

  /* -- status bar ---------------------------------------------------------------- */
  .statusbar { height:30px; flex:none; display:flex; align-items:center; gap:12px; padding:0 14px;
    background:var(--chrome); border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
  .statusbar .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; } .statusbar .sp { flex:1; }
  .statusbar svg { width:12px; height:12px; vertical-align:-2px; }
  .statusbar .offline { padding:2px 8px; font-size:10px; }
  .linklike { border:0; background:transparent; color:var(--muted); text-decoration:underline; text-underline-offset:2px;
    cursor:pointer; font:inherit; font-size:11px; padding:0; }
  .status-disc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* -- sources popover ----------------------------------------------------------- */
  .pop { position:absolute; z-index:20; width:min(360px,90vw); background:var(--card); border:1px solid var(--line-strong);
    border-radius:12px; box-shadow:var(--shadow); padding:13px; opacity:0; pointer-events:none; transition:opacity .14s; }
  .pop.on { opacity:1; pointer-events:auto; }
  .pop h4 { font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 9px; font-weight:700; }
  .srcline { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:11.5px; }
  .srcline:first-of-type { border-top:0; } .srcline svg { width:13px; height:13px; color:var(--muted); flex:none; }
  .srcline .u { font-family:var(--mono); font-size:10.5px; color:var(--ink); word-break:break-all; flex:1; }
  .srcline .k { font-size:9px; font-weight:700; text-transform:uppercase; color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:1px 6px; flex:none; }
  .pop .foot { font-size:10.5px; color:var(--muted); margin:9px 0 0; }

  /* -- toast --------------------------------------------------------------------- */
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px); background:var(--card);
    border:1px solid var(--line-strong); padding:12px 16px; border-radius:11px; box-shadow:0 10px 34px rgba(0,0,0,.22);
    font-size:13.5px; display:flex; align-items:center; gap:9px; opacity:0; pointer-events:none;
    transition:opacity .22s, transform .22s; max-width:92vw; z-index:40; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .tk { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; } .toast.err .tk { background:var(--err); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="window" id="window" data-conn="0">
  <div class="toolbar">
    <div class="brand"><img class="logo" src="logo.svg" alt="" width="26" height="26"><b>nwupdater</b></div>
    <span class="sp"></span>
    <div class="seg" role="group" aria-label="mode">
      <button id="mode-individual" class="conn" aria-pressed="true" onclick="setMode('individual')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.2" r="2.6"/><path d="M3.4 12.6a4.6 4.6 0 0 1 9.2 0" stroke-linecap="round"/></svg>
        <span id="mode-individual-label"></span><span class="cdot" aria-hidden="true"></span></button>
      <button id="mode-classroom" aria-pressed="false" onclick="setMode('classroom')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="5" cy="6" r="2"/><circle cx="11" cy="6" r="2"/><path d="M1.8 12.4a3.4 3.4 0 0 1 6.4 0M7.8 12.4a3.4 3.4 0 0 1 6.4 0" stroke-linecap="round"/></svg>
        <span id="mode-classroom-label"></span></button>
    </div>
    <div class="seg langseg" role="group" aria-label="Language">
      <button id="lang-fr" onclick="setLang('fr')">FR</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="iconbtn" id="quit-btn" onclick="quitApp()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 2.5H3.5A1.5 1.5 0 0 0 2 4v8a1.5 1.5 0 0 0 1.5 1.5H6"/><path d="M10 11l3-3-3-3M13 8H6"/></svg></button>
  </div>

  <div class="body">
    <aside class="rail" id="rail"></aside>

    <section class="main">
      <div class="tabbar" role="tablist" aria-label="sections">
        <button class="tab" role="tab" id="tab-parc" aria-selected="false" aria-controls="pane-parc" onclick="setTab('parc')" style="display:none">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="4" width="12" height="8" rx="1.5"/><path d="M2 7h12"/></svg>
          <span id="tab-parc-label"></span><span class="cnt" id="tab-parc-cnt"></span></button>
        <button class="tab" role="tab" id="tab-system" aria-selected="true" aria-controls="pane-system" onclick="setTab('system')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 8h3l1.5-4 3 8L13 8h1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="tab-system-label"></span><span class="updot" id="updot" style="display:none" title="update available"></span></button>
        <button class="tab" role="tab" id="tab-apps" aria-selected="false" aria-controls="pane-apps" onclick="setTab('apps')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>
          <span id="tab-apps-label"></span><span class="cnt" id="tab-apps-cnt"></span></button>
        <button class="tab" role="tab" id="tab-scripts" aria-selected="false" aria-controls="pane-scripts" onclick="setTab('scripts')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4 3 8l2.5 4M10.5 4 13 8l-2.5 4"/></svg>
          <span id="tab-scripts-label"></span><span class="cnt" id="tab-scripts-cnt"></span></button>
      </div>

      <div class="panes">
        <div class="pane on" id="pane-system" role="tabpanel" aria-labelledby="tab-system">
          <div class="card2" id="flash-card">
            <h3><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v8m0 0 3-3m-3 3L5 7" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12.5h11" stroke-linecap="round"/></svg><span id="flash-title"></span></h3>
            <p class="muted" id="c-text" style="margin:0"></p>
            <div class="row" id="c-row" style="margin-top:11px">
              <div class="seg" role="group" aria-label="channel">
                <button id="chan-stable" onclick="setChannel('stable')"></button>
                <button id="chan-beta" onclick="setChannel('beta')"></button>
              </div>
              <select id="c-select" aria-label="version"></select>
              <button class="btn" id="c-install" onclick="installFw()"></button>
            </div>
            <label class="dl-toggle" id="c-dl-toggle"><input type="checkbox" id="c-download" onchange="renderCatalog()">
              <span id="c-dl-label"></span></label>
            <p class="riskline" id="c-risk"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5 1.8 13h12.4L8 2.5Z"/><path d="M8 6.6v2.6M8 11.1v.1" stroke-linecap="round"/></svg><span id="c-risk-label"></span></p>
            <p class="hint" id="c-exam-warn"></p>
            <p class="hint" id="c-slot"></p>
            <div class="meterwrap" id="c-meterwrap"><div class="meter" id="c-meter"></div></div>
            <div class="result" id="c-result" aria-live="polite"></div>
          </div>

          <div class="card2" id="account-card"></div>
          <div class="card2" id="classroom-card" style="display:none"></div>
        </div>

        <div class="pane roster" id="pane-parc" role="tabpanel" aria-labelledby="tab-parc"></div>
        <div class="pane workshop" id="pane-apps" role="tabpanel" aria-labelledby="tab-apps"></div>
        <div class="pane workshop" id="pane-scripts" role="tabpanel" aria-labelledby="tab-scripts"></div>
      </div>

      <div class="nodev-main"><div class="nodev" id="nodev-main"></div></div>
    </section>
  </div>

  <div class="statusbar">
    <span class="dot"></span>
    <span id="status-local">Local module · no WebUSB</span>
    <span class="offline" id="status-offline" style="display:none"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.8 2 4.3v3.4c0 3.4 2.5 5.6 6 6.5 3.5-.9 6-3.1 6-6.5V4.3L8 1.8Z"/></svg><span id="status-offline-label"></span></span>
    <span class="sp"></span>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="7" width="9" height="6" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
    <span class="status-disc" id="status-disc"></span>
    <button class="linklike" id="status-learn" onclick="showDisclaimer()"></button>
  </div>
</div>

<div class="pop" id="src-pop">
  <h4 id="src-pop-title"></h4>
  <div id="src-pop-list"></div>
  <p class="foot" id="src-pop-foot"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="tk"></span><span id="toast-msg"></span></div>
<script src="i18n.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
