<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Le registre des modèles pilote les capacités, le device virtuel et le layout ; comparaison N0120 et N0200">
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">Un seul point d'édition : le registre des modèles</text>

  <!-- central -->
  <rect x="330" y="50" width="220" height="62" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="440" y="74" font-size="12.5" font-weight="700" fill="#7a3100" text-anchor="middle">Model → MODELS[…]</text>
  <text x="440" y="92" font-size="10.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">models.py</text>
  <text x="440" y="106" font-size="9.5" fill="#57606a" text-anchor="middle">source de vérité</text>

  <!-- derived -->
  <line x1="390" y1="112" x2="200" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="440" y1="112" x2="440" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="490" y1="112" x2="680" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="40" y="154" width="240" height="74" rx="9" fill="#ffffff" stroke="#8250df"/>
  <text x="160" y="178" font-size="12" font-weight="700" fill="#3e1f79" text-anchor="middle">Capacités</text>
  <text x="160" y="196" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">capabilities.py</text>
  <text x="160" y="214" font-size="9.5" fill="#1f2328" text-anchor="middle">apps · scripts · slots A/B</text>

  <rect x="320" y="154" width="240" height="74" rx="9" fill="#ffffff" stroke="#1a7f37"/>
  <text x="440" y="178" font-size="12" font-weight="700" fill="#0f4c25" text-anchor="middle">Device virtuel</text>
  <text x="440" y="196" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">testing/virtual_dfu.py</text>
  <text x="440" y="214" font-size="9.5" fill="#1f2328" text-anchor="middle">construit depuis la carte mémoire</text>

  <rect x="600" y="154" width="240" height="74" rx="9" fill="#ffffff" stroke="#0969da"/>
  <text x="720" y="178" font-size="12" font-weight="700" fill="#0a3069" text-anchor="middle">Layout DFU</text>
  <text x="720" y="196" font-size="9.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">dfu/layout.py</text>
  <text x="720" y="214" font-size="9.5" fill="#1f2328" text-anchor="middle">secteurs de flash</text>

  <rect x="300" y="236" width="280" height="22" rx="11" fill="#eaeef2" stroke="#57606a"/>
  <text x="440" y="251" font-size="10.5" font-weight="700" fill="#1f2328" text-anchor="middle">dérivé automatiquement — vérifier, ne pas éditer</text>

  <!-- comparison -->
  <rect x="40" y="272" width="390" height="132" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="56" y="294" font-size="13" font-weight="700" fill="#0f4c25">N0120 — Graphique</text>
  <text x="56" y="316" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">confirmed = True</text>
  <text x="56" y="333" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">has_ab_slots = True</text>
  <text x="56" y="350" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">external_flash_origin = 0x90000000</text>
  <text x="56" y="367" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">opaque_firmware = False</text>
  <text x="56" y="390" font-size="11.5" font-weight="700" fill="#0f4c25">→ apps ✓  scripts ✓  version lisible ✓</text>

  <rect x="450" y="272" width="390" height="132" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="466" y="294" font-size="13" font-weight="700" fill="#7a3100">N0200 — Scientifique</text>
  <text x="466" y="316" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">confirmed = False   (carte inférée)</text>
  <text x="466" y="333" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">has_ab_slots = False</text>
  <text x="466" y="350" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">external_flash_origin = None</text>
  <text x="466" y="367" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">opaque_firmware = True · flash_erase = False</text>
  <text x="466" y="390" font-size="11.5" font-weight="700" fill="#7a3100">→ apps ✗  scripts ✗  mise à jour seule</text>
</svg>
