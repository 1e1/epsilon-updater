<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Carte des quatre façons de contribuer, par effort croissant">
  <rect x="0" y="0" width="880" height="360" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#1f2328">Quatre façons de contribuer</text>
  <text x="24" y="56" font-size="12" fill="#57606a">Choisir un axe selon l'objet de la contribution. L'ordre suit l'effort attendu.</text>

  <!-- Card 1 : app / script -->
  <rect x="24" y="76" width="196" height="196" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <circle cx="52" cy="106" r="14" fill="#1a7f37"/>
  <text x="52" y="111" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="104" font-size="13" font-weight="700" fill="#0f4c25">Référencer</text>
  <text x="76" y="120" font-size="13" font-weight="700" fill="#0f4c25">une app / script</text>
  <text x="40" y="150" font-size="11.5" fill="#1f2328">Éditer un fichier JSON,</text>
  <text x="40" y="166" font-size="11.5" fill="#1f2328">ou déposer un fichier</text>
  <text x="40" y="182" font-size="11.5" fill="#1f2328">dans un dossier.</text>
  <rect x="40" y="200" width="164" height="24" rx="5" fill="#ffffff" stroke="#1a7f37"/>
  <text x="48" y="216" font-size="10.5" fill="#0f4c25" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">apps/data/*.json</text>
  <text x="40" y="248" font-size="10.5" fill="#57606a">Barrière : très faible</text>

  <!-- Card 2 : front -->
  <rect x="236" y="76" width="196" height="196" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="264" cy="106" r="14" fill="#0969da"/>
  <text x="264" y="111" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="288" y="104" font-size="13" font-weight="700" fill="#0a3069">Modifier</text>
  <text x="288" y="120" font-size="13" font-weight="700" fill="#0a3069">le front</text>
  <text x="252" y="150" font-size="11.5" fill="#1f2328">Éditer la page locale :</text>
  <text x="252" y="166" font-size="11.5" fill="#1f2328">HTML + JavaScript,</text>
  <text x="252" y="182" font-size="11.5" fill="#1f2328">parité FR / EN.</text>
  <rect x="252" y="200" width="164" height="24" rx="5" fill="#ffffff" stroke="#0969da"/>
  <text x="260" y="216" font-size="10.5" fill="#0a3069" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">server/web/*.js</text>
  <text x="252" y="248" font-size="10.5" fill="#57606a">Barrière : faible</text>

  <!-- Card 3 : API -->
  <rect x="448" y="76" width="196" height="196" rx="10" fill="#f3e8ff" stroke="#8250df"/>
  <circle cx="476" cy="106" r="14" fill="#8250df"/>
  <text x="476" y="111" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="500" y="104" font-size="13" font-weight="700" fill="#3e1f79">Interfacer</text>
  <text x="500" y="120" font-size="13" font-weight="700" fill="#3e1f79">une API NumWorks</text>
  <text x="464" y="150" font-size="11.5" fill="#1f2328">Ajouter un appel réseau</text>
  <text x="464" y="166" font-size="11.5" fill="#1f2328">pur et injectable,</text>
  <text x="464" y="182" font-size="11.5" fill="#1f2328">testé hors-ligne.</text>
  <rect x="464" y="200" width="164" height="24" rx="5" fill="#ffffff" stroke="#8250df"/>
  <text x="472" y="216" font-size="10.5" fill="#3e1f79" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">catalog/*.py</text>
  <text x="464" y="248" font-size="10.5" fill="#57606a">Barrière : moyenne</text>

  <!-- Card 4 : device -->
  <rect x="660" y="76" width="196" height="196" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <circle cx="688" cy="106" r="14" fill="#bc4c00"/>
  <text x="688" y="111" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="712" y="104" font-size="13" font-weight="700" fill="#7a3100">Ajouter</text>
  <text x="712" y="120" font-size="13" font-weight="700" fill="#7a3100">un device</text>
  <text x="676" y="150" font-size="11.5" fill="#1f2328">Rétro-ingénierie d'une</text>
  <text x="676" y="166" font-size="11.5" fill="#1f2328">révision matérielle.</text>
  <text x="676" y="182" font-size="11.5" fill="#1f2328">Exemples : N0120, N0200.</text>
  <rect x="676" y="200" width="164" height="24" rx="5" fill="#ffffff" stroke="#bc4c00"/>
  <text x="684" y="216" font-size="10.5" fill="#7a3100" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">models.py</text>
  <text x="676" y="248" font-size="10.5" fill="#57606a">Barrière : élevée</text>

  <!-- Effort axis -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <line x1="24" y1="300" x2="852" y2="300" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="24" y="322" font-size="11" fill="#57606a">effort faible</text>
  <text x="852" y="322" font-size="11" fill="#57606a" text-anchor="end">effort élevé</text>
  <text x="440" y="344" font-size="11" fill="#57606a" text-anchor="middle">Règle du dépôt : jamais d'USB réel. Tout se teste contre le device virtuel, hors-ligne.</text>
</svg>
