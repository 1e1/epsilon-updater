name: pages

# Publishes the public landing page (site/) to GitHub Pages: project pitch, screenshots and
# download buttons for the latest release binaries. Static only — the actual updater UI needs
# the local Python backend + USB and is NOT served here. The download links are resolved
# client-side from the latest GitHub Release, so the page needs no rebuild when a release ships.

on:
  push:
    branches: [ main, develop ]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "src/nwupdater/server/web/logo.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site (copy screenshots + logo next to index.html)
        run: |
          mkdir -p site/assets
          cp docs/screenshots/nwupdater-n0120-individual.png site/assets/
          cp docs/screenshots/nwupdater-n0200-classroom.png site/assets/
          cp src/nwupdater/server/web/logo.svg site/assets/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true  # turn on Pages (source: GitHub Actions) if not already enabled

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
