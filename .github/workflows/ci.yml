name: ci

# Lint + type-check + tests + security scan on every push and PR. Everything runs against the
# in-process virtual DFU device (no real USB, no network), so CI is deterministic and offline.
# The full Python matrix runs on Linux; macOS and Windows are smoke-tested on one Python version
# to catch platform regressions (the desktop apps ship for all three).

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Type-check (mypy)
        run: python -m mypy src
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Security scan (bandit)
        run: python -m bandit -r src -ll
