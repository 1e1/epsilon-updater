name: ci

# Lint + type-check + tests + security scan on every push and PR. Everything runs against the
# in-process virtual DFU device (no real USB, no network), so CI is deterministic and offline.
# The full Python matrix runs on Linux; macOS and Windows are smoke-tested on one Python version
# to catch platform regressions (the desktop apps ship for all three).

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm derives the version from tags + full history
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The native UI extra is installed here too, so its tests actually RUN and count towards
      # the coverage gate. Without it the Qt-dependent modules are collected but never imported,
      # which reads as 0 % and drags the total below the threshold — a false red that says
      # nothing about the code.
      - name: Install
        run: python -m pip install --upgrade pip ".[dev,gui]"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Format check (ruff)
        run: python -m ruff format --check src tests
      - name: Type-check (mypy)
        run: python -m mypy src
      # The QML half used to have no static gate at all: a two-level `parent.parent` chain, a
      # size set on a layout child, a method called on an untyped `currentItem` — all of it
      # only ever surfaced at runtime, in a window nobody opened in CI.
      #
      # `unqualified` is the one category left off, and it cannot be fixed rather than waived:
      # `backend` and `i18n` reach QML as context properties, which are unqualifiable by
      # construction, and they account for ~400 of the ~420 findings. Silencing that category
      # is what makes the other twenty visible. Registering both as QML singletons would clear
      # it, but only pays off with generated .qmltypes — tracked for after 3.0.
      - name: Lint the QML scene (qmllint)
        run: |
          cd src/nwupdater/gui/qml
          pyside6-qmllint -I . --unqualified disable *.qml
      # Coverage gate on Linux (full Python matrix); macOS/Windows just smoke-test the suite so
      # platform-specific branch coverage can't make the threshold flaky.
      - name: Tests + coverage (pytest)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov=nwupdater --cov-report=term-missing
      - name: Tests (pytest)
        if: matrix.os != 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Security scan (bandit)
        run: python -m bandit -r src -ll

  ui-smoke:
    # Headless-browser smoke test of the local web UI (Playwright + Chromium). Separate job so
    # the browser download only runs once and never slows the core matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm derives the version from tags + full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip ".[dev,test-ui]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: UI smoke + logic tests (pytest)
        run: python -m pytest tests/test_ui_smoke.py tests/test_ui_logic.py -q
