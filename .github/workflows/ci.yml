name: ci

# Lint + tests on every push and PR. Everything runs against the in-process virtual DFU
# device (no real USB, no network), so CI is deterministic and offline.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Security scan (bandit, non-blocking)
        run: python -m bandit -r src -ll || true
