name: build-capture

# Builds the `nwupdater-capture` CLI (web-feature discovery tool) and attaches the binaries +
# the checklist to the GitHub Release. The capture tooling ships ONLY in release-candidate
# deliverables: this workflow triggers only on RC tags (v*-rc*). Stable releases (build-apps.yml,
# the updater GUI) do NOT contain the capture tools. Unsigned binaries.

on:
  push:
    tags: [ "v*-rc*" ]   # RC only — capture tools are not shipped in stable releases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # universal2 (Intel + Apple Silicon)
            asset: nwupdater-capture-macos-universal
          - os: ubuntu-latest
            asset: nwupdater-capture-linux
          - os: windows-latest
            asset: nwupdater-capture-windows
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}  # mac universal2 must not block win/linux
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm needs tags + history to stamp the shipped version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Build capture CLI
        run: pyinstaller packaging/nwupdater-capture.spec --noconfirm
      - name: Package (zip)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" "nwupdater-capture.exe"
          else
            chmod +x nwupdater-capture
            zip "../${{ matrix.asset }}.zip" nwupdater-capture
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          # Consumed by the release job in the same run and then attached to the Release, so the
          # artifact copy is redundant afterwards — keep it short to spare the storage quota.
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Stage checklist alongside the binaries
        run: cp docs/01-specs/web-features-capture-checklist.md dist/CHECKLIST-web-features.md
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/**/*.zip
            dist/CHECKLIST-web-features.md
